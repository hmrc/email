}

microservice {
  metrics {
    gauges {
      interval = 15 minutes
      initialDelay = 30 seconds
      read-timeout = 20 seconds
    }
  }

  services {
    timeout = 30 seconds

    delay-response = 2 seconds

    protocol = http

    mailgun {
      host = localhost
      port = 8185
    }

    imi {
      host = localhost
      port = 8185
    }

    imi-consent {
      host = localhost
      port = 8185
    }

    hmrc-email-renderer {
      host = localhost
      port = 8950
    }

    fset-email-renderer {
      host = localhost
      port = 8960
    }

    developer-email-renderer {
      host = localhost
      port = 8955
    }

    event-hub {
      host = localhost
      port = 9050
    }
  }
}

message.queue.retryInterval = 1 minute
message.queue.inProgressRetryAfter.millis = 60000 # 1 minute

message.event-emitter {
  retryInterval = 1 minute
  inProgressRetryAfter.millis = 600000 # 10 minutes
  numberOfRetries = 5
}

event-hub.event-emitter {
  inProgressRetryAfter.millis = 600000 # 10 minutes
}

event-hub {
  collection = "event_hub"
  expireAfterSeconds = 259200 # 3 days TTL on documents held in event_hub collection
  failedBefore = 10 minutes # How long before an inProgress item is picked up again for processing (considered stuck and needs a retry)
  enabled = false
}

events-expiry {
  sentEventInDays = 90
  deliveredEventInDays = 60
  openedEventInDays = 30
  permanentBounceEventInDays = 30
}


lock.forceReleaseAfter = 5 minutes

bounce.expiry = 28 days

streams {
  event-hub {
    uri.path = "/publish/email" # Event hub topic configuration
    event-polling-interval = 1 minute # How long should the stream wait before polling the event-hub collection again for presence of queued work-items
    max-retries = 500 # How many times should we attempt to send an event to the event-hub when it fails before marking it as permanently failed
    elements = 60 # How many elements are to be emitted downstream over the time period defined by elements-per
    elements-per = 3 seconds # The time period over which the number of events defined by elements can be sent (downstream) to event hub
    min-back-off = 100.millis # The minimum amount of time to wait before attempting to restart the event hub stream
    max-back-off = 10.minutes # The maximum amount of time to wait before attempting to restart the event hub stream
  }
}

serviceInstanceCounter {
  timeout = 1 hour
}

scheduling {
  serviceInstanceCounter {
    initialDelay = 10 seconds
    interval = 1 minute
    timeout = 1 hour
  }
  defaultQueue {
    initialDelay = 1 seconds
    interval = 10 seconds
  }
  urgentQueue {
    initialDelay = 1 seconds
    interval = 10 seconds
  }
  backgroundQueue {
    initialDelay = 1 seconds
    interval = 10 seconds
  }
  event-emitter {
    initialDelay = 1 second
    interval = 10 second
  }
  event-processing-sftp {
    initialDelay = 10 minutes
    interval = 10 minutes
  }
  clean-suppression-list {
    initialDelay = 10 minutes
    interval = 10 days
  }
}

proxy {
  proxyRequiredForThisEnvironment = false
}

sources {
  mailboxMetrics.countByStatus = false
  mailboxMetrics.countByTemplate = false
}
email-stats {
  resetIntervalDays = 7
}

akka {
  stdout-loglevel = "warning"
  loglevel = "warning"
  actor {
    debug {
      # enable DEBUG logging of unhandled messages
      unhandled = off
      # enable DEBUG logging of subscription changes on the eventStream
      event-stream = off
    }
  }
}

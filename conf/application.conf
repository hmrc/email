    }

    backgroundQueue {
      rate = 40000/day
    }
  }
  
  fsetfaststream {
     # The sender domain name. EG: tax.service.gov.uk
    name = exampleDomain
    renderer = fset-email-renderer
    imiConnector = false
    mailgun {
      apiKey = exampleApiKey
      publicApiKey = examplePublicApiKey
    }
    imi {
          apiKey = exampleApiKey
          groupId = "replaceThis"
    }
    defaultQueue {
      rate = 103000/day
    }

    backgroundQueue {
      rate = 40000/day
    }
  }

  transactionengine {
    # The sender domain name. EG: tax.service.gov.uk
    name = exampleDomain
    renderer = hmrc-email-renderer
    imiConnector = true
    mailgun {
      apiKey = exampleApiKey
      publicApiKey = examplePublicApiKey
    }
    imi {
          apiKey = exampleApiKey
          groupId = "replaceThis"
    }
    defaultQueue {
      rate = 103000/day
    }

    backgroundQueue {
      rate = 40000/day
    }
  }

  apicatalogue {
    # The sender domain name. EG: tax.service.gov.uk
    name = exampleDomain
    renderer = hmrc-email-renderer
    imiConnector = true
    mailgun {
      apiKey = exampleApiKey
      publicApiKey = examplePublicApiKey
    }
    imi {
          apiKey = exampleApiKey
          groupId = "replaceThis"
    }

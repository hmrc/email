  developer {
      # The sender domain name. EG: tax.service.gov.uk
      name = exampleDomain
      renderer = developer-email-renderer
      imiConnector = true
      mailgun {
          apiKey = exampleApiKey
          publicApiKey = examplePublicApiKey
      }
      imi {
            apiKey = exampleApiKey
            groupId = "replaceThis"
      }
      defaultQueue {

          rate = 103000/day
      }

      backgroundQueue {
          rate = 40000/day
      }

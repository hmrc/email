include "backend.conf"
appName = email

# A http client must be provided for non-mailgun related calls (of which do not go through the squid proxy)
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"

play.modules.enabled += "uk.gov.hmrc.email.EmailModule"

play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"

# Session Timeout
# ~~~~
# The default session timeout for the app is 15 minutes (900seconds).
# Updating this is the responsibility of the app - it must issue a new cookie with each request or the session will
# timeout 15 minutes after login (regardless of user activity).
# session.maxAge=900

# Session configuration
# ~~~~~
application.session.httpOnly = false

application.session.secure = false

# The application languages
# ~~~~~
play.i18n.langs = ["en"]

# Ensure proxy is always disabled for development
http-verbs.proxy.enabled = false

# Global object class
# ~~~~~
# Define the Global object class for this application.
# Default to Global in the root package.
application.global = uk.gov.hmrc.email.config.Global

# Router
# ~~~~~
# Define the Router object to use for this application.
# This router will be looked up first when the application is starting up,
# so make sure this is the entry point.
# Furthermore, it's assumed your route file is named properly.
# So for an application router like `my.application.Router`,
# you may need to define a router file `conf/my.application.prod.routes`.
# Default to Routes in the root package (and conf/prod.routes)
play.http.router = prod.Routes

# Ensuring TLS v1.2 is used as this is a requirement for Mailgun
play.ws.ssl.protocol = "TLSv1.2"

# Controller
# ~~~~~
# By default all controllers will have authorisation, logging and
# auditing (transaction monitoring) enabled.
# The below controllers are the default exceptions to this rule.


crypto.key = "WrongKeyReplaceThiskey=="


# Evolutions
# ~~~~~
# You can disable evolutions if needed
# evolutionplugin=disabled

# Metrics plugin settings - graphite reporting is configured on a per env basis
metrics {
  enabled = true
}

mongodb {
  uri = "mongodb://localhost:27017/email"
  channels = 5
  failoverStrategy = {
    initialDelayMsecs = 100
    retries = 10
    delay = {
      function = fibonacci
      factor = 1
    }
  }
}
doNotUseInProductionEmailDomainAllowList = []
eventUrlMapping = {
  regex = "(\\/\\/.*?)\\.(service)([:\\/])"
  replaceString = ".protected.mdtp"
}
disable-mailgun-validation = false

replyToTemplateIds = "digital_tariffs_advice_request"

imi.notifyUrl = ""
imi.consentServiceKey = "sampleKey"
imi.sftpKey = ""
imi.sftpPath = ""
suppression-list-expiry-days = 360
suppression-list-page-size = 1000
suppression-list-delete-throttle-duration-millis = 500
suppression-list-delete-domain-list = []
# Sender Domains
senderDomains {

  hmrc {

    # The sender domain name. EG: tax.service.gov.uk
    name = exampleDomain
    renderer = hmrc-email-renderer
    imiConnector = true
    mailgun {
      apiKey = exampleApiKey
      publicApiKey = examplePublicApiKey
    }
    imi {
          apiKey = exampleApiKey
          groupId = "replaceThis"
    }
    defaultQueue {
      rate = 103000/day
    }

    backgroundQueue {
      rate = 40000/day
    }

    events {
      collection = "mailgunEvents"
    }

    bounces {
      collection = "bounce"
    }
  }

  fset {
     # The sender domain name. EG: tax.service.gov.uk
    name = exampleDomain
